name: setup
description: Node and Bun at their pinned versions, and the dependencies installed.
runs:
  using: composite
  steps:
    # Vite and Vitest run on Node, so it is pinned too rather than left to
    # whatever the runner image carries.
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .nvmrc
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version-file: package.json
    - run: bun install --frozen-lockfile
      shell: bash
